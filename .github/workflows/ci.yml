name: CI - Build e Testes

on:
  # Repositorio proprio do backend desde 29/10/2026 (antes era a pasta backend/ do
  # monorepo GabrielVogado/saude-monitor). Branches do git-flow: develop e master.
  push:
    branches: [develop, master]
  # `feature/**` e `bugfix/**` desde 05/10/2026, a pedido do PO: PR empilhado (base em
  # outra branch de trabalho) ficava sem CI e sem Sonar até o anterior entrar. Nesses
  # PRs a trava de contagem compara com o ancestral verde mais próximo da base (em
  # geral um commit da develop) e o diff-cover mede só as linhas do próprio PR.
  pull_request:
    branches: [develop, master, 'feature/**', 'bugfix/**']

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    env:
      # Só "true"/"false": o token em si não fica exposto aos passos de build e
      # teste. A análise do Sonar pula enquanto o secret não existir (e em PR de
      # fork, que não recebe secrets) sem reprovar o CI.
      TEM_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo: o SonarQube Cloud usa o blame para separar o
          # código novo do antigo. Com o clone raso padrão, tudo vira "novo".
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Compilar e rodar testes
        # `build` inclui `check`, que agora depende da verificação de cobertura
        # do JaCoCo: queda abaixo do piso reprova o PR (DOD-01 / E8-08).
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Publicar relatório de cobertura (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: build/reports/jacoco/test
          retention-days: 14
          if-no-files-found: ignore

      - name: Contar testes executados (backend)
        run: >-
          python3 .github/scripts/contagem_testes.py contar --area backend
          --relatorio build/test-results/test
          --cobertura build/reports/jacoco/test/jacocoTestReport.xml --saida contagem-testes

      - name: Cobertura do código novo (mínimo 90%)
        # M-031: as linhas que o PR altera nesta área precisam de pelo menos 90% de
        # cobertura (decisão do PO em 04/10/2026). Linhas fora do recorte da
        # cobertura da área (DTOs, estilos...) não entram na conta.
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          pip install --quiet diff-cover==10.6.0
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml --compare-branch="$BASE" --src-roots src/main/java --fail-under=90

      - name: Publicar contagem de testes (backend)
        uses: actions/upload-artifact@v4
        with:
          name: contagem-testes-backend
          path: contagem-testes/backend.json
          # A contagem do CI de push da develop/master é o "cenário anterior"
          # da trava de testes: precisa sobreviver a períodos sem merge.
          retention-days: 90

      - name: Análise SonarQube Cloud (backend)
        if: env.TEM_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Reaproveita as classes e o XML do JaCoCo gerados pelo `build` acima.
        run: ./gradlew --no-daemon sonar

  contagem-testes:
    # Trava de contagem de testes (M-030): o PR não pode reduzir a quantidade de
    # testes de nenhuma área e, na área cujo código de produção ele altera, precisa
    # aumentá-la. O "cenário anterior" é a contagem do CI de push do commit da
    # base, publicada pelos próprios jobs acima. Regra e recorte de "código
    # de produção" em .github/scripts/contagem_testes.py.
    name: Trava de contagem de testes
    # O nome do check fica o mesmo; desde a M-031 o job também barra queda da
    # cobertura total de cada área.
    if: github.event_name == 'pull_request'
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contagem deste PR
        uses: actions/download-artifact@v4
        with:
          pattern: contagem-testes-*
          path: atual
          merge-multiple: true

      - name: Contagem da base
        # O checkout de PR é o merge commit: o primeiro pai é exatamente o commit da
        # base contra o qual este CI rodou. A contagem vem do CI de push desse commit,
        # e não do "último CI verde", que pode ser de outro commit (re-run de PR
        # antigo, ou base com CI vermelho/em andamento) e comparar código diferente.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          BASE_SHA=$(git rev-parse HEAD^1)
          run_do_commit() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$1&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"'
          }
          # O CI de push da base costuma estar terminando junto com este: espera até 20 min.
          for _ in $(seq 40); do
            read -r ID STATUS CONCLUSAO _ <<< "$(run_do_commit "$BASE_SHA") x x x"
            [ "$STATUS" = "completed" ] || [ "$ID" = "x" ] && break
            echo "CI $ID da base ($BASE_SHA) ainda em $STATUS; aguardando..."
            sleep 30
          done
          # Base sem CI verde (vermelho, ou commit de antes da trava): usa o ancestral
          # verde mais próximo e avisa, porque os testes entre ele e a base contam
          # como do PR.
          for SHA in $(git rev-list --first-parent -n 30 "$BASE_SHA"); do
            read -r ID STATUS CONCLUSAO _ <<< "$(run_do_commit "$SHA") x x x"
            [ "$CONCLUSAO" = "success" ] || continue
            if gh run download "$ID" --repo "$GITHUB_REPOSITORY" --pattern 'contagem-testes-*' --dir baixado 2>/dev/null; then
              find baixado -name '*.json' -exec cp {} base/ \;
              echo "Base: CI $ID do commit $SHA"
              if [ "$SHA" != "$BASE_SHA" ]; then
                echo "::warning::A base ($BASE_SHA) não tem CI verde; comparando com o ancestral $SHA."
              fi
              exit 0
            fi
          done
          echo "::warning::Nenhuma contagem de testes nos últimos 30 commits da base; a deste PR só fica registrada."

      - name: Arquivos alterados no PR
        # Diferença entre o merge commit e a base: exatamente o que o PR traz.
        run: git diff --name-only HEAD^1 HEAD > alterados.txt

      - name: Comparar
        run: python3 .github/scripts/contagem_testes.py comparar --atual atual --base base --alterados alterados.txt
