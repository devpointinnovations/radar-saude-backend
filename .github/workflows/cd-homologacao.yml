# Homologacao (HML) do backend: cada push na `master` vira uma versao candidata publicada.
#
# Decisao do PO em 22/09/2026: `master` = homologacao; producao fica para `release/<tag>`.
# Desde 29/10/2026 o backend tem repositorio proprio e homologa sozinho; o APK de
# homologacao sai do radar-saude-mobile, com a rc dele, e aponta para a URL fixa abaixo.
#
#   push em master
#     -> versao   calcula vX.Y.Z-rc.N (X.Y.Z do `version` do build.gradle, N = proxima rc livre)
#     -> backend  Cloud Run `saude-monitor-backend-hom` + smoke tests (cd-backend-google.yml)
#     -> release  confere a URL fixa de homologacao, cria tag + GitHub Release (pre-release)
#
# Uma falha do backend nao cria tag. A URL fixa e a URL DETERMINISTICA do Cloud Run,
# `https://<servico>-<numero do projeto>.<regiao>.run.app`, a mesma embutida no APK.
name: CD - Homologação

on:
  push:
    branches: [master]
  # Manual SO na `master` (o job `versao` recusa outra ref): o `cd-backend-google.yml`
  # escolhe o ambiente pela ref, e um disparo da `develop` publicaria o backend de DEV
  # e uma "rc de homologacao" apontando para ele.
  workflow_dispatch:

# Uma rc por vez, e a em andamento nunca e cancelada (deixaria o pipeline pela metade).
# Limite do GitHub: o grupo guarda UMA execucao pendente -- com tres merges seguidos, o
# segundo e descartado quando o terceiro chega. Nao se perde codigo: o terceiro contem o
# segundo, e o changelog da rc lista os dois PRs; so aquele commit intermediario nao
# ganha rc propria.
concurrency:
  group: homologacao
  cancel-in-progress: false

env:
  # URL deterministica do servico de homologacao (ver o cabecalho).
  API_URL_HOM: https://saude-monitor-backend-hom-767615581088.southamerica-east1.run.app

permissions:
  contents: read

jobs:
  versao:
    name: Calcular versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      version_name: ${{ steps.calc.outputs.version_name }}
      anterior: ${{ steps.calc.outputs.anterior }}
    steps:
      - name: Só a master publica homologação
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "ERRO: homologacao so e publicada a partir da master (ref atual: $GITHUB_REF)."
            exit 1
          fi

      # So o build.gradle e os NOMES das tags interessam: clone raso + `ls-remote`.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular vX.Y.Z-rc.N
        id: calc
        run: |
          set -euo pipefail
          TAGS=$(git ls-remote --tags origin 'refs/tags/v*-rc.*' | sed -E 's#.*refs/tags/##; s#\^\{\}$##' | sort -u)
          BASE=$(sed -nE "s/^version = '([^']+)'.*/\1/p" build.gradle)
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERRO: version '$BASE' em build.gradle nao e X.Y.Z."
            exit 1
          fi

          # Re-execucao no mesmo commit reaproveita a rc que ja aponta para ele, em vez de
          # queimar um numero novo para o mesmo codigo.
          EXISTENTE=$(git ls-remote --tags origin "refs/tags/v${BASE}-rc.*" | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -1)
          if [ -n "$EXISTENTE" ]; then
            N=${EXISTENTE##*-rc.}
          else
            ULTIMA=$(printf '%s\n' "$TAGS" | grep -E "^v${BASE//./\\.}-rc\.[0-9]+$" | sed 's/.*-rc\.//' | sort -n | tail -1 || true)
            N=$(( ${ULTIMA:-0} + 1 ))
          fi
          TAG="v${BASE}-rc.${N}"

          # rc anterior (a maior abaixo desta), para o changelog.
          ANTERIOR=$(printf '%s\n' "$TAGS" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | sort -uV | grep -B1 -x "$TAG" | head -1)
          [ "$ANTERIOR" = "$TAG" ] && ANTERIOR=""

          {
            echo "tag=$TAG"
            echo "version_name=${BASE}-rc.${N}"
            echo "anterior=$ANTERIOR"
          } >> "$GITHUB_OUTPUT"
          echo "🏷️ \`$TAG\` · anterior: \`${ANTERIOR:-nenhuma}\`" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend HML
    needs: versao
    uses: ./.github/workflows/cd-backend-google.yml
    permissions:
      contents: read
      id-token: write

  release:
    name: Tag e GitHub Release
    needs: [versao, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # O deploy devolve a URL de hash; o APK usa a URL deterministica. Antes de publicar
      # a rc, prova que a URL fixa de homologacao responde.
      - name: Conferir a URL fixa de homologação
        run: |
          for TENTATIVA in 1 2 3 4 5 6; do
            CODIGO=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$API_URL_HOM/actuator/health" || echo 000)
            echo "tentativa $TENTATIVA -> HTTP $CODIGO"
            [ "$CODIGO" = "200" ] && exit 0
            sleep 10
          done
          echo "ERRO: $API_URL_HOM nao respondeu 200."
          exit 1

      - name: Criar tag e Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
          VERSION_NAME: ${{ needs.versao.outputs.version_name }}
          ANTERIOR: ${{ needs.versao.outputs.anterior }}
        run: |
          set -euo pipefail

          # Re-execucao: a Release ja existe.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "♻️ Release \`$TAG\` já existia." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Changelog pela API de notas do GitHub, desde a rc anterior (PRs mergeados).
          ARGS=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          [ -n "$ANTERIOR" ] && ARGS+=(-f "previous_tag_name=$ANTERIOR")
          MUDANCAS=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body)

          {
            echo "## Radar Saúde Backend HML $VERSION_NAME"
            echo ""
            echo "- **Backend de homologação:** $API_URL_HOM"
            echo "- **Commit:** \`${GITHUB_SHA:0:7}\` (imagem no Artifact Registry com esta SHA)"
            echo ""
            echo "$MUDANCAS"
          } > notas.md

          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Radar Saúde Backend HML $VERSION_NAME" \
            --notes-file notas.md

          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "📦 [$TAG]($URL) publicado." >> "$GITHUB_STEP_SUMMARY"
